[project]
name = "aeroshield-ai"
version = "2.1.0"
description = "AeroShield AI: Urban Air Quality & Winter Smog Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "google-generativeai>=0.8.0",
]

[tool.vercel]
entrypoint = "main:app"
